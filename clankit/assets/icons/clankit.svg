<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>

  <!-- Commit Graph Lines -->
  <g filter="url(#shadow)">
    <!-- Main branch trunk -->
    <path d="M 180 120 L 180 392" stroke="url(#trunkGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Fork and merge branch -->
    <path d="M 180 190 C 230 190, 332 210, 332 260 C 332 310, 230 330, 180 330"
          stroke="url(#branchGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- Commit Nodes -->
    <!-- Top trunk node -->
    <circle cx="180" cy="140" r="28" fill="#38bdf8"/>
    <circle cx="180" cy="140" r="13" fill="#ffffff"/>

    <!-- Trunk fork point node -->
    <circle cx="180" cy="205" r="22" fill="#60a5fa"/>
    <circle cx="180" cy="205" r="10" fill="#ffffff"/>

    <!-- Branch node -->
    <circle cx="332" cy="260" r="30" fill="#f43f5e"/>
    <circle cx="332" cy="260" r="14" fill="#ffffff"/>

    <!-- Trunk merge point node -->
    <circle cx="180" cy="315" r="22" fill="#34d399"/>
    <circle cx="180" cy="315" r="10" fill="#ffffff"/>

    <!-- Bottom trunk node -->
    <circle cx="180" cy="375" r="28" fill="#10b981"/>
    <circle cx="180" cy="375" r="13" fill="#ffffff"/>
  </g>
</svg>
