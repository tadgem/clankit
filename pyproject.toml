[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clankit"
version = "0.1.0"
description = "A fast, unbiased SourceTree-like Git GUI wrapper in Python powered by Dear PyGui"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Liam", email = "liam@example.com" }
]
keywords = ["git", "gui", "sourcetree", "dearpygui", "version-control", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "dearpygui>=2.3.1",
]

[project.scripts]
clankit = "clankit.main:main"
clankit-desktop = "clankit.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clankit*"]

[tool.setuptools.package-data]
clankit = [
    "assets/*",
    "assets/fonts/*",
    "assets/icons/*",
]
